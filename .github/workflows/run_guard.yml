name: Run Guard

on:
  push:
    branches: [main, "fix/**", "feature/**"]
    paths:
      - "CURRENT_RUN_LEDGER.yaml"
      - "RUN_GUARD_POLICY.yaml"
      - "DECISION_CONTRACT.json"
      - "DECISION_RULE_CROSSWALK.md"
      - "validate_run_guard.py"
      - "validate_decision_contract.py"
      - "DECISION_LOG.jsonl"
      - "AGENTS.md"
      - "CURRENT_HANDOFF.md"
      - "CURRENT_LIVE_STATE.json"
      - "LIVE_EVENTS.jsonl"
      - "live_state_engine.py"
      - "knowledge_engine.py"
      - "text_fast.py"
      - "navigator_step.py"
      - "quick_image_pipeline.py"
      - "docs/P5_QUICK_IMAGE_PROTOCOL.md"
      - "docs/FAST_PLAY_PROTOCOL.md"
      - "chat_bridge.py"
      - "check_reply.py"
      - "docs/REPLY_GUARD_P7D.md"
      - "project_bootstrap.py"
      - "PROJECT_ENTRYPOINT.json"
      - "docs/PROJECT_RESUME_P6.md"
      - "docs/CHAT_BRIDGE_P4.md"
      - ".github/workflows/chat_bridge.yml"
      - "NAV_TACTICS.json"
      - "docs/NAVIGATOR_STEP_PROTOCOL.md"
      - "EVIDENCE_EVENTS.jsonl"
      - "EVIDENCE_BACKUP_CHECKPOINTS.jsonl"
      - "backup_verifier.py"
      - "EXPERIMENT_TRIALS.jsonl"
      - "KNOWLEDGE_CLAIMS.json"
      - "KNOWLEDGE_MANIFEST.json"
      - "docs/KNOWLEDGE_PROTOCOL.md"
      - "screen_reader.py"
      - "tests/**"
      - "docs/LIVE_OBSERVATION_CONTRACT.md"
      - "docs/SCREEN_READER.md"
      - "SAPPORO_SPRINT_STRATEGY.md"
      - ".github/workflows/run_guard.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: run-guard-main
  cancel-in-progress: false

jobs:
  run-guard:
    name: run-guard
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate repository state
        shell: bash
        run: |
          set -uo pipefail
          python3 validate_run_guard.py \
            --repo "${GITHUB_REPOSITORY}" \
            --sha "${GITHUB_SHA}" \
            --mode guard \
            --json-out "${RUNNER_TEMP}/GUARD_RESULT.json" \
            | tee "${RUNNER_TEMP}/guard-output.txt"
          validator_status=${PIPESTATUS[0]}
          if [[ -f "${RUNNER_TEMP}/GUARD_RESULT.json" ]]; then
            cat "${RUNNER_TEMP}/GUARD_RESULT.json" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo '{"result":"NO_RESULT","guard_verified":false}' >> "${GITHUB_STEP_SUMMARY}"
          fi
          exit "${validator_status}"

      - name: Validate decision contract trace
        shell: bash
        run: |
          set -euo pipefail
          python3 validate_decision_contract.py \
            --json-out "${RUNNER_TEMP}/DECISION_CONTRACT_RESULT.json"
          cat "${RUNNER_TEMP}/DECISION_CONTRACT_RESULT.json" >> "${GITHUB_STEP_SUMMARY}"

      - name: Validate evidence and knowledge continuity
        shell: bash
        run: |
          set -euo pipefail
          python3 knowledge_engine.py validate | tee "${RUNNER_TEMP}/KNOWLEDGE_RESULT.json"
          cat "${RUNNER_TEMP}/KNOWLEDGE_RESULT.json" >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify navigator P3 current snapshot gate
        shell: bash
        run: |
          set -euo pipefail
          python3 navigator_step.py "スキル獲得に向けて何をすべき？" --boot-verified --expected-event-seq 10 > "${RUNNER_TEMP}/NAVIGATOR_RESULT.json"
          python3 -c 'import json,sys;p=json.load(open(sys.argv[1])); assert p["status"]=="BLOCKED_UNVERIFIED_TIMELINE"; assert p["action_authorized"] is False; assert "SKILL-4TH-PATTERN" in p["knowledge_refs"]' "${RUNNER_TEMP}/NAVIGATOR_RESULT.json"
      - name: Verify P4 chat bridge pinned CLI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          import tempfile
          from pathlib import Path
          import chat_bridge
          from navigator_step import navigator_step
          root=Path.cwd()
          main_sha=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          state=json.loads((root/"CURRENT_LIVE_STATE.json").read_text(encoding="utf-8"))
          req={"schema_version":"1.0","request_id":"p4-ci-readonly",
               "intent":"SKILL","expected_main_sha":main_sha,
               "expected_event_seq":state["last_event_seq"]}
          result=chat_bridge.bridge_response(req,root=root,actual_main_sha=main_sha)
          assert result["action_authorized"] is False
          assert result["side_effects"] is False
          assert "SKILL-4TH-PATTERN" in result["knowledge_refs"]
          print("P4_CI_BRIDGE_PASS:"+json.dumps(
              {"sha":main_sha,"event_seq":result["state_event_seq"],
               "status":result["status"]},ensure_ascii=False))
          PY

      - name: P6 verify one-phrase BOOT and bridge with exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 project_bootstrap.py "野球部ものがたりの続き" --expected-main-sha "${GITHUB_SHA}" > "${RUNNER_TEMP}/PROJECT_BOOT.json"
          python3 - <<'PY'
          import json, os
          from chat_bridge import bridge_response
          sha = os.environ["GITHUB_SHA"]
          report = json.load(open(os.environ["RUNNER_TEMP"] + "/PROJECT_BOOT.json", encoding="utf-8"))
          assert report["source_commit_sha"] == sha
          assert report["status"] == "BOOT_VERIFIED_ACTIONS_BLOCKED"
          assert report["live_replay_verified"] is True
          assert report["knowledge_integrity_verified"] is True
          assert "SKILL-4TH-PATTERN" in report["knowledge"]["required_claim_ids"]
          assert report["action_authorized"] is False
          request = {"schema_version": "1.0", "request_id": "p6-ci-resume",
                     "intent": "BOOT", "expected_main_sha": sha,
                     "expected_event_seq": report["state"]["event_seq"]}
          returned = bridge_response(request, root=".", actual_main_sha=sha)
          assert returned["status"] == report["status"]
          assert returned["source_commit_sha"] == sha
          assert returned["action_authorized"] is False
          print("P6_ONE_PHRASE_BOOT_PASS:" + json.dumps({
              "source_sha": sha, "event_seq": report["state"]["event_seq"],
              "status": returned["status"], "knowledge": returned["knowledge_refs"]
          }, ensure_ascii=False))
          PY
      - name: Install screenshot reader image library
        shell: bash
        run: python3 -m pip install --disable-pip-version-check "Pillow==11.3.0"

      - name: P5 local screenshot benchmark (synthetic, not iPhone latency)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import tempfile
          from pathlib import Path
          from PIL import Image
          from quick_image_pipeline import benchmark_local
          with tempfile.TemporaryDirectory() as directory:
              path=Path(directory)/"synthetic_world.png"
              image=Image.new("RGB",(2622,1206),(10,20,30))
              image.putpixel((100,80),(10,150,240))
              image.save(path)
              result=benchmark_local(path,repeats=9)
          assert result["unique_pixel_decode_calls"] == 1
          assert result["chat_latency_measured"] is False
          print("P5_SYNTHETIC_LOCAL_BENCHMARK:"+json.dumps(
              result,ensure_ascii=False))
          PY

      - name: Test live state ingestion and replay
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
          python3 live_state_engine.py \
            --events LIVE_EVENTS.jsonl \
            --snapshot CURRENT_LIVE_STATE.json \
            --contract DECISION_CONTRACT.json
